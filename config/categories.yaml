# Drive 저장 위치
#   · 우선순위: 환경변수 > 이 파일
#   · 환경변수: GDRIVE_FOLDER_ID, GDRIVE_SPREADSHEET_ID
#   · 로컬:    .env 파일에 설정
#   · Actions: repository secrets 에 등록
# 아래 값들은 환경변수가 없을 때 사용되는 fallback 입니다.
# .
# ─────────────────────────────────────────────────────────────
folder_id: "1tcWyrBmHlVMW-x6F7_X9kM9Aqlb0Nq3q"
