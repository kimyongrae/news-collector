  # ── 금리/환율 ─────────────────────────────────────────────
  # ✅ keyword_filter: 제목에 이 단어 중 하나라도 있는 기사만 수집
  #    → 주식/경제 피드에서 금리·환율 관련 기사만 걸러냄
  #    → 다른 카테고리와 같은 피드를 써도 다른 기사가 수집됨
  - name: 금리/환율
    keyword_filter:
      - 금리
      - 환율
      - 달러
      - 원화
      - 기준금리
      - 채권
      - 국채
      - 레포
      - FOMC
      - 연준
      - Fed
      - 한국은행
      - 통화
      - 외환
      - 원달러
      - 엔화
      - 위안
    sources:
      - type: rss
        url: https://rss.mk.co.kr/rss/30000010.xml   # 매일경제 국제금융
        label: 매일경제_국제금융
        crawl_body: true
        limit: 8

      - type: rss
        url: https://www.hankyung.com/feed/economy    # 경제 피드에서 금리 기사 필터
        label: 한국경제_금리환율
        crawl_body: true
        limit: 10

      - type: rss
        url: https://www.yna.co.kr/economy/rss.xml   # 연합뉴스 경제
        label: 연합뉴스_금리
        crawl_body: true
        limit: 10

      - type: rss
        url: https://www.bok.or.kr/portal/bbs/P0000559/list.do?menuNo=200690&feed=on
        label: 한국은행
        crawl_body: true
        limit: 5

