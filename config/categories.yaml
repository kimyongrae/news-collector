  # ── 많이 본 뉴스 (조회수 TOP) ─────────────────────────────
  # ✅ 2026-04-22 추가: 네이버 랭킹 페이지에서 조회순/댓글순 TOP 기사를 수집.
  #    순위·조회수(혹은 댓글수) 가 시트 K/L 열에 기록되어 TubeAI 대시보드에서
  #    "조회수 많은 뉴스 먼저" 로 정렬 가능.
  #    sectionId 매핑:
  #      100=정치 / 101=경제 / 102=사회 / 103=생활문화 / 104=세계 / 105=IT과학
  - name: 많이본뉴스_경제
    sources:
      - type: naver_ranking
        url: https://news.naver.com/main/ranking/popularDay.naver?sectionId=101
        label: 네이버랭킹_경제(조회)
        ranking_type: view
        limit: 15

      - type: naver_ranking
        url: https://news.naver.com/main/ranking/popularMemo.naver?sectionId=101
        label: 네이버랭킹_경제(댓글)
        ranking_type: comment
        limit: 10

