<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #080b12;
  --bg2:      #0f1420;
  --bg3:      #161d2e;
  --border:   #1e2a3a;
  --accent:   #3b82f6;
  --accent2:  #06b6d4;
  --green:    #10b981;
  --yellow:   #f59e0b;
  --red:      #ef4444;
  --purple:   #8b5cf6;
  --text1:    #e8eaf4;
  --text2:    #7c849c;
  --text3:    #3a4256;
  --mono:     'JetBrains Mono', monospace;
  --font:     'Noto Sans KR', sans-serif;
  --r:        10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text1);min-height:100vh;overflow-x:hidden}

/* 배경 효과 */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 5% 0%, rgba(59,130,246,.07) 0%, transparent 55%),
    radial-gradient(ellipse 50% 60% at 95% 100%, rgba(6,182,212,.05) 0%, transparent 55%);
  pointer-events:none;z-index:0;
}

/* ── 헤더 ── */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(8,11,18,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  height:60px;padding:0 28px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.3px}
.logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:16px;
}
.header-meta{display:flex;align-items:center;gap:16px}
#clock{font-family:var(--mono);font-size:12px;color:var(--text3)}
.live-dot{
  width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── 레이아웃 ── */
.wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:24px 28px 60px}

/* ── 월 탭 ── */
.month-bar{
  display:flex;align-items:center;gap:8px;
  overflow-x:auto;padding-bottom:2px;margin-bottom:24px;
  scrollbar-width:none;
}
.month-bar::-webkit-scrollbar{display:none}
.month-tab{
  flex-shrink:0;padding:6px 18px;border-radius:20px;
  border:1px solid var(--border);background:transparent;
  color:var(--text2);font-size:13px;font-family:var(--font);
  cursor:pointer;transition:all .2s;white-space:nowrap;
}
.month-tab:hover{border-color:var(--accent);color:var(--accent)}
.month-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

/* ── 통계 카드 ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 18px;transition:border-color .2s;
}
.stat-card:hover{border-color:var(--border)}
.stat-label{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.stat-val{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1}
.c-blue{color:var(--accent)} .c-cyan{color:var(--accent2)}
.c-green{color:var(--green)} .c-yellow{color:var(--yellow)}
.c-purple{color:var(--purple)} .c-red{color:var(--red)}

/* ── 필터 바 ── */
.filter-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-bottom:20px;
}
.filter-label{font-size:11px;color:var(--text3);letter-spacing:.5px;margin-right:4px}
.chip{
  padding:5px 13px;border-radius:16px;
  border:1px solid var(--border);background:transparent;
  color:var(--text2);font-size:12px;font-family:var(--font);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.chip:hover,.chip.active{
  background:var(--bg3);border-color:var(--accent);color:var(--accent);
}
.chip.imp5.active{border-color:var(--yellow);color:var(--yellow)}
.chip.imp4.active{border-color:var(--accent2);color:var(--accent2)}

.filter-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-box{position:relative}
.search-box input{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;padding:7px 12px 7px 34px;
  color:var(--text1);font-size:13px;font-family:var(--font);
  outline:none;width:200px;transition:border-color .2s;
}
.search-box input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3)}
.sort-select{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:7px 12px;color:var(--text2);font-size:12px;font-family:var(--font);
  outline:none;cursor:pointer;
}

/* ── 카드 그리드 ── */
#cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(380px,1fr));
  gap:14px;
}
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:18px 20px;display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  animation:fadeUp .35s ease both;cursor:default;
}
.card:hover{
  transform:translateY(-2px);
  border-color:rgba(59,130,246,.4);
  box-shadow:0 6px 24px rgba(59,130,246,.08);
}
/* 중요도 색상 */
.card.imp5{border-left:3px solid var(--yellow)}
.card.imp4{border-left:3px solid var(--accent2)}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.card-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cat-badge{
  font-size:10px;font-weight:700;letter-spacing:.5px;
  padding:2px 9px;border-radius:4px;white-space:nowrap;
}
.cat-경제{background:rgba(59,130,246,.15);color:var(--accent)}
.cat-부동산{background:rgba(16,185,129,.15);color:var(--green)}
.cat-주식{background:rgba(245,158,11,.15);color:var(--yellow)}
.cat-금리환율,.cat-금리\/환율{background:rgba(139,92,246,.15);color:var(--purple)}
.cat-네이버금융{background:rgba(6,182,212,.15);color:var(--accent2)}
.cat-default{background:rgba(124,130,160,.15);color:var(--text2)}

.card-right{display:flex;align-items:center;gap:6px}
.imp-badge{
  font-family:var(--mono);font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:4px;
}
.imp-5{background:rgba(245,158,11,.15);color:var(--yellow)}
.imp-4{background:rgba(6,182,212,.15);color:var(--accent2)}
.imp-3{background:rgba(124,130,160,.1);color:var(--text3)}
.imp-1,.imp-2{background:rgba(60,64,80,.2);color:var(--text3)}

.sent-badge{font-size:10px;padding:2px 7px;border-radius:4px}
.sent-긍정{background:rgba(16,185,129,.12);color:var(--green)}
.sent-부정{background:rgba(239,68,68,.12);color:var(--red)}
.sent-중립{background:rgba(60,64,80,.2);color:var(--text3)}

.card-title{font-size:14px;font-weight:700;line-height:1.55;color:var(--text1)}
.card-title a{color:inherit;text-decoration:none;transition:color .2s}
.card-title a:hover{color:var(--accent)}

.card-summary{
  font-size:12px;line-height:1.7;color:var(--text2);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}

.card-keywords{display:flex;flex-wrap:wrap;gap:5px}
.kw{
  font-size:11px;padding:2px 8px;border-radius:4px;
  background:var(--bg3);border:1px solid var(--border);color:var(--text3);
}

.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:8px;border-top:1px solid var(--border);
}
.card-media{font-size:11px;color:var(--text3)}
.card-pub{font-family:var(--mono);font-size:10px;color:var(--text3)}

/* ── 빈 상태 / 스켈레톤 ── */
#empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3)}
#empty .ico{font-size:40px;margin-bottom:12px}

.skel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.sh{border-radius:4px;animation:shimmer 1.3s infinite;
  background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);
  background-size:200% 100%;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── 토스트 ── */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:#1a0f0f;border:1px solid var(--red);color:var(--red);
  padding:10px 20px;border-radius:8px;font-size:13px;
  transition:transform .3s;z-index:999;
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── 반응형 ── */
@media(max-width:640px){
  header{padding:0 16px}
  .wrap{padding:16px 16px 40px}
  #cards{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📰</div>
    뉴스 리포트
  </div>
  <div class="header-meta">
    <div class="live-dot"></div>
    <span id="clock"></span>
  </div>
</header>

<div class="wrap">
  <div class="month-bar" id="month-bar"></div>
  <div class="stat-grid" id="stat-grid" style="display:none"></div>
  <div class="filter-bar" id="filter-bar" style="display:none">
    <span class="filter-label">카테고리</span>
    <div id="cat-chips"></div>
    <div class="filter-right">
      <div class="search-box">
        <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="제목·키워드 검색…" oninput="render()">
      </div>
      <select class="sort-select" id="sort-sel" onchange="render()">
        <option value="collected">수집순</option>
        <option value="importance">중요도순</option>
        <option value="published">발행순</option>
      </select>
    </div>
  </div>
  <div id="cards"></div>
</div>

<div id="toast"></div>

<script>
// ── 상태 ──────────────────────────────────────────────────────
const S = {
  months: [],       // index.json 월 목록
  articles: [],     // 현재 월 기사
  curMonth: '',
  activeCat: '전체',
};

// ── 초기화 ────────────────────────────────────────────────────
window.onload = () => {
  startClock();
  loadIndex();
};

function startClock() {
  const el = document.getElementById('clock');
  const tick = () => {
    el.textContent = new Date().toLocaleString('ko-KR', {
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
    });
  };
  tick(); setInterval(tick, 1000);
}

// ── index.json 로드 ───────────────────────────────────────────
async function loadIndex() {
  try {
    const res  = await fetch('data/index.json?t=' + Date.now());
    if (!res.ok) throw new Error('index.json 없음');
    const data = await res.json();
    S.months = data.months || [];

    // 월 탭 렌더
    const bar = document.getElementById('month-bar');
    bar.innerHTML = [...S.months].reverse().map(m => `
      <button class="month-tab" data-m="${m.month}" onclick="selectMonth('${m.month}')">
        ${m.month} <span style="color:var(--text3);font-size:11px">(${m.total})</span>
      </button>
    `).join('');

    // 가장 최신 월 자동 로드
    if (S.months.length) {
      const latest = S.months[S.months.length - 1].month;
      selectMonth(latest);
    }
  } catch(e) {
    // index.json 없으면 현재 월 직접 시도
    const cur = new Date().toISOString().slice(0,7);
    const bar = document.getElementById('month-bar');
    bar.innerHTML = `<button class="month-tab active" data-m="${cur}" onclick="selectMonth('${cur}')">${cur}</button>`;
    loadMonth(cur);
  }
}

// ── 월 선택 ───────────────────────────────────────────────────
function selectMonth(m) {
  S.curMonth = m;
  S.activeCat = '전체';
  document.querySelectorAll('.month-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.m === m)
  );
  loadMonth(m);
}

// ── 월 JSON 로드 ──────────────────────────────────────────────
async function loadMonth(m) {
  showSkeleton();
  try {
    const res = await fetch(`data/${m}.json?t=` + Date.now());
    if (!res.ok) throw new Error(`${m}.json 없음`);
    const data = await res.json();
    S.articles = data.articles || [];
    buildStats(data);
    buildCatChips();
    render();
  } catch(e) {
    toast('데이터를 불러올 수 없습니다: ' + e.message);
    document.getElementById('cards').innerHTML =
      `<div id="empty"><div class="ico">📭</div><p>아직 수집된 데이터가 없습니다.</p></div>`;
  }
}

// ── 통계 ─────────────────────────────────────────────────────
const CAT_COLORS = {
  '경제':'c-blue','부동산':'c-green','주식':'c-yellow',
  '금리/환율':'c-purple','네이버금융':'c-cyan',
};

function buildStats(data) {
  const cats = {};
  (data.articles||[]).forEach(a => { cats[a.category] = (cats[a.category]||0) + 1; });

  const grid = document.getElementById('stat-grid');
  grid.style.display = 'grid';
  grid.innerHTML = [
    `<div class="stat-card"><div class="stat-label">전체 기사</div><div class="stat-val c-blue">${data.total}</div></div>`,
    ...Object.entries(cats).map(([c,n]) =>
      `<div class="stat-card"><div class="stat-label">${c}</div><div class="stat-val ${CAT_COLORS[c]||'c-cyan'}">${n}</div></div>`
    )
  ].join('');
}

// ── 카테고리 칩 ──────────────────────────────────────────────
function buildCatChips() {
  const cats = ['전체', ...new Set(S.articles.map(a => a.category))];
  const wrap = document.getElementById('cat-chips');
  wrap.innerHTML = cats.map(c =>
    `<button class="chip ${c===S.activeCat?'active':''}" onclick="setCat('${c}',this)">${c}</button>`
  ).join('');
  document.getElementById('filter-bar').style.display = 'flex';
}

function setCat(c, el) {
  S.activeCat = c;
  document.querySelectorAll('#cat-chips .chip').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── 카드 렌더 ─────────────────────────────────────────────────
function render() {
  const q    = (document.getElementById('search')?.value||'').toLowerCase();
  const sort = document.getElementById('sort-sel')?.value || 'collected';

  let list = S.articles.filter(a => {
    const catOk = S.activeCat === '전체' || a.category === S.activeCat;
    const qOk   = !q || a.title.toLowerCase().includes(q)
                     || a.keywords.toLowerCase().includes(q)
                     || a.summary.toLowerCase().includes(q);
    return catOk && qOk;
  });

  // 정렬
  if (sort === 'importance') list.sort((a,b) => (+b.importance||0) - (+a.importance||0));
  else if (sort === 'published') list.sort((a,b) => (b.published||'').localeCompare(a.published||''));

  const grid = document.getElementById('cards');
  if (!list.length) {
    grid.innerHTML = `<div id="empty"><div class="ico">🔍</div><p>조건에 맞는 기사가 없습니다.</p></div>`;
    return;
  }

  grid.innerHTML = list.map((a, i) => {
    const catKey = a.category.replace('/','\/');
    const catCls = `cat-${catKey}`;
    const impCls = `imp${a.importance}`;
    const impBadge = `imp-${a.importance}`;
    const sentCls  = `sent-${a.sentiment}`;
    const kws = (a.keywords||'').split(',').map(k=>k.trim()).filter(Boolean);

    return `
<div class="card ${impCls}" style="animation-delay:${Math.min(i*30,400)}ms">
  <div class="card-top">
    <span class="cat-badge ${catCls}">${a.category}</span>
    <div class="card-right">
      <span class="imp-badge ${impBadge}">${'★'.repeat(+a.importance||1)}</span>
      <span class="sent-badge ${sentCls}">${a.sentiment||'중립'}</span>
    </div>
  </div>
  <div class="card-title">
    <a href="${a.url}" target="_blank" rel="noopener">${a.title}</a>
  </div>
  ${a.summary ? `<div class="card-summary">${a.summary}</div>` : ''}
  ${kws.length ? `<div class="card-keywords">${kws.map(k=>`<span class="kw">${k}</span>`).join('')}</div>` : ''}
  <div class="card-footer">
    <span class="card-media">📌 ${a.media}</span>
    <span class="card-pub">${a.published || a.collected || ''}</span>
  </div>
</div>`;
  }).join('');
}

// ── 스켈레톤 ─────────────────────────────────────────────────
function showSkeleton() {
  document.getElementById('cards').innerHTML = Array(6).fill(`
    <div class="skel">
      <div class="sh" style="height:14px;width:100px"></div>
      <div class="sh" style="height:17px;width:88%"></div>
      <div class="sh" style="height:12px"></div>
      <div class="sh" style="height:12px;width:70%"></div>
    </div>`).join('');
}

// ── 토스트 ───────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
</html>
