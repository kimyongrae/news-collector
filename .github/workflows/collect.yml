name: 뉴스 자동 수집

on:
  schedule:
    # 매일 오전 9시 KST (= UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:
    # 수동 실행도 가능 (GitHub UI에서 Run workflow 버튼)
    inputs:
      config_path:
        description: "설정 파일 경로 (기본: config/categories.yaml)"
        required: false
        default: "config/categories.yaml"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Google 서비스 계정 키 파일 생성
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > credentials.json

      - name: 뉴스 수집 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CONFIG="${{ github.event.inputs.config_path || 'config/categories.yaml' }}"
          python src/collector.py "$CONFIG"

      - name: 자격증명 파일 삭제
        if: always()
        run: rm -f credentials.json
