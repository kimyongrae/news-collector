name: 뉴스 자동 수집

on:
  # ─────────────────────────────────────────────────────────
  # 스케줄 (UTC 기준)
  # ─────────────────────────────────────────────────────────
  # ⚠️ GitHub Actions 공식 문서 권고:
  #    "The schedule event can be delayed during periods of high loads
  #     of GitHub Actions workflow runs. High load times include the
  #     start of every hour. To decrease the chance of delay, schedule
  #     your workflow to run at a different time of the hour."
  #
  # 이전 설정 "0 0 * * *" (UTC 00:00 = KST 09:00) 는 **정시 정각**이라
  # 부하가 몰려 실행이 건너뛰어지는 경우가 잦았습니다.
  # 아래는 KST 09:17 (UTC 00:17) 로 이동 — 정시를 피하고 장 초반에 실행.
  # GitHub Actions schedule 은 부하 상황에 따라 지연될 수 있으므로,
  # 실제 실행 시각을 로그로 남깁니다. 지연되더라도 하루 1회 수집/발송은 진행합니다.
  schedule:
    - cron: "17 0 * * *"

  # 수동 실행 (Actions 탭 → Run workflow) 및 디버깅용
  workflow_dispatch:
    inputs:
      config_path:
        description: "설정 파일 경로"
        required: false
        default: "config/categories.yaml"

# ───────────────────────────────────────────────────────────
# 동시 실행 방지 — 이전 실행이 끝나지 않은 상태에서 새 스케줄이
# 중첩되면 Sheets 쓰기가 충돌할 수 있으므로 순차 실행으로 강제.
# ───────────────────────────────────────────────────────────
concurrency:
  group: news-collector-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 2026-04-28: LAST_RUN.txt 자동 커밋으로 60일 비활성 → schedule 자동 비활성 방지
    permissions:
      contents: write

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 📦 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⏰ 스케줄 실행 시간 확인
        if: github.event_name == 'schedule'
        run: |
          NOW="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "현재 한국시간: $NOW"
          echo "GitHub Actions schedule 은 지연될 수 있습니다. 지연되더라도 오늘 수집/발송은 진행합니다."

      - name: 🔐 시크릿 존재 여부 점검
        env:
          GOOGLE_OAUTH_TOKEN:   ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_FOLDER_ID:     ${{ secrets.GDRIVE_FOLDER_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_ACCESS_TOKEN:   ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN:  ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_REST_API_KEY:   ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET:  ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          echo "--- 시크릿 점검 (값은 출력하지 않음) ---"
          if [ -z "$GOOGLE_OAUTH_TOKEN" ]; then
            echo "❌ GOOGLE_OAUTH_TOKEN 미설정 — Settings → Secrets 에 등록하세요"; exit 1
          else
            echo "✅ GOOGLE_OAUTH_TOKEN 설정됨 (${#GOOGLE_OAUTH_TOKEN} chars)"
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️  GEMINI_API_KEY 미설정 — AI 분석이 단순 추출로 fallback"
          else
            echo "✅ GEMINI_API_KEY 설정됨"
          fi
          if [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "ℹ️  GDRIVE_FOLDER_ID 미설정 — categories.yaml 의 folder_id 사용"
          else
            echo "✅ GDRIVE_FOLDER_ID 설정됨"
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "ℹ️  Supabase 미설정 — Sheets 단독 저장 (정상 동작)"
          else
            echo "✅ Supabase 설정됨"
          fi
          if [ -z "$KAKAO_ACCESS_TOKEN" ]; then
            echo "ℹ️  KAKAO_ACCESS_TOKEN 미설정 — refresh token 설정이 있으면 자동 갱신 시도"
          else
            echo "✅ KAKAO_ACCESS_TOKEN 설정됨"
          fi
          if [ -z "$KAKAO_REFRESH_TOKEN" ] || [ -z "$KAKAO_REST_API_KEY" ]; then
            echo "ℹ️  KAKAO_REFRESH_TOKEN 또는 KAKAO_REST_API_KEY 미설정 — access token 자동 갱신 불가"
          else
            echo "✅ Kakao refresh 설정됨"
          fi

      - name: 📰 뉴스 수집 실행
        env:
          GOOGLE_OAUTH_TOKEN:    ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_FOLDER_ID:      ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SPREADSHEET_ID: ${{ secrets.GDRIVE_SPREADSHEET_ID }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 보관 기간 — secret 미설정 시 collector 가 기본 90일 사용.
          # 365 (1년) 권장. 한도의 26% 수준에서 안정화 + YoY 비교 가능.
          SUPABASE_RETENTION_DAYS: ${{ secrets.SUPABASE_RETENTION_DAYS || '365' }}
          PYTHONUNBUFFERED:      "1"
          TZ:                    "Asia/Seoul"
        run: |
          CONFIG="${{ github.event.inputs.config_path || 'config/categories.yaml' }}"
          echo "--- 실행: python src/collector.py $CONFIG ---"
          python src/collector.py "$CONFIG"

      - name: 💬 카카오 시황 발송
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_ACCESS_TOKEN:    ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN:   ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_REST_API_KEY:    ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET:   ${{ secrets.KAKAO_CLIENT_SECRET }}
          PYTHONUNBUFFERED:      "1"
          TZ:                    "Asia/Seoul"
        run: |
          echo "--- 실행: python send_once.py ---"
          python send_once.py

      # ─────────────────────────────────────────────────────
      # 60일 무커밋 시 GitHub 가 schedule 을 자동 비활성화하므로
      # 매 실행마다 LAST_RUN.txt 에 타임스탬프 기록 후 커밋·푸시.
      # 변경 없으면 (실패 시) 그냥 스킵.
      # ─────────────────────────────────────────────────────
      - name: 💓 keepalive — LAST_RUN.txt 갱신
        if: success()
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/LAST_RUN.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/LAST_RUN.txt
          if git diff --cached --quiet; then
            echo "no changes — skip"
          else
            git commit -m "chore: keepalive $(date -u +%F)"
            git push
          fi

      - name: 🚨 실패 시 요약
        if: failure()
        run: |
          echo "::error::뉴스 수집 워크플로 실패"
          echo "이전 단계 로그를 확인하세요."
          echo "체크리스트:"
          echo "  1. Secrets 가 모두 등록돼 있는지 (GOOGLE_OAUTH_TOKEN, GEMINI_API_KEY)"
          echo "  2. OAuth refresh_token 이 만료/취소되지 않았는지"
          echo "  3. Google Drive folder_id 가 유효한지"
          echo "  4. requirements.txt 의존성이 빌드되는지"
