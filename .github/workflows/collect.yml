name: 뉴스 자동 수집

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      config_path:
        description: "설정 파일 경로"
        required: false
        default: "config/categories.yaml"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip 캐시 설정
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: 의존성 설치
        if: steps.pip-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: 뉴스 수집 실행
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
        run: |
          CONFIG="${{ github.event.inputs.config_path || 'config/categories.yaml' }}"
          python src/collector.py "$CONFIG"